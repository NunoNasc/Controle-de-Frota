# Piloto gratuito: Render Free + PostgreSQL externo no Supabase.
services:
  - type: web
    name: central-controle-frota
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: commit
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm exec next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
